<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14122b">
<title>복불복</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">

  <!-- 홈: 참가자와 게임 고르기 -->
  <section id="home" class="screen">
    <header class="hero">
      <div>
        <h1>복불복</h1>
        <p>오늘은 누가 걸릴까</p>
      </div>
      <button id="sound" class="icon-btn" aria-label="소리 켜기/끄기">🔊</button>
    </header>

    <section class="panel">
      <div class="panel-head">
        <h2>참가자</h2>
        <span id="player-count" class="muted"></span>
      </div>
      <ul id="players"></ul>
      <p class="hint">얼굴을 누르면 캐릭터가 바뀝니다</p>
    </section>

    <div class="games">
      <button class="game-card" data-game="ladder"><span class="emoji">🪜</span><span><b>사다리 타기</b><small>자리를 고르고 내려가기</small></span></button>
      <button class="game-card" data-game="roulette"><span class="emoji">🎡</span><span><b>룰렛</b><small>돌려서 멈춘 사람</small></span></button>
      <button class="game-card" data-game="race"><span class="emoji">🏁</span><span><b>달리기 경주</b><small>다 같이 출발, 꼴찌가 당첨</small></span></button>
      <button class="game-card" data-game="chairs"><span class="emoji">🪑</span><span><b>의자 뺏기</b><small>음악이 멈추면 앉기, 못 앉으면 당첨</small></span></button>
    </div>

    <section id="tally" hidden>
      <b>오늘의 전적</b>
      <div id="tally-list"></div>
      <button id="tally-reset">지우기</button>
    </section>
    <button id="open-history" class="btn wide">📅 지난 기록 보기</button>
  </section>

  <!-- 기록: 날짜별로 쌓인 전적 -->
  <section id="history" class="screen" hidden>
    <header class="game-head">
      <button id="h-back" class="icon-btn" aria-label="뒤로">←</button>
      <h2>기록</h2>
    </header>
    <div id="h-body"></div>
  </section>

  <!-- 게임 화면 -->
  <section id="game" class="screen" hidden>
    <header class="game-head">
      <button id="back" class="icon-btn" aria-label="뒤로">←</button>
      <h2 id="game-title"></h2>
    </header>
    <div id="stage"></div>
  </section>

</main>
<script src="app.js"></script>
</body>
</html>
